[package]
name = "mcload"
version = "0.1.0"
edition = "2021"
description = "McLoad — There can be only one!"
license = "MIT"
readme = "README.md"

[[bin]]
name = "mcload"
path = "src/main.rs"

[lib]
name = "mcload"
path = "src/lib.rs"

[features]
# FrankenTUI is on by default so `mcload croft` / `mcload loft` start without flags.
default = ["frankentui"]
frankentui = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
# FrankenTUI 0.7.x — facade (native TTY backend) + explicit tty/web hosts.
ftui = { version = "0.7", default-features = true }
ftui-tty = "0.7"
ftui-web = "0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
